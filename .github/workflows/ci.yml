name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest --cov=app --cov-report=term-missing
      - run: docker build -t student-platform-api:test .
      - run: docker build -t student-platform-backend:test workloads/backend
      - name: Validate monitoring config exists
        run: python -c "import json; json.load(open('kubernetes/monitoring/grafana-dashboard.json'))"
